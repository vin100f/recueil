<style>
:root{
  --bg:#F6F3EC; --card:#FFFFFF; --ink:#1B1B2F; --mute:#6B6A75; --line:#E4DFD3;
  --gold:#9A7A22; --goldbg:#F3E9CC; --chip:#ECE7DA; --chipon:#1B1B2F; --chiponink:#FFFFFF;
  --red:#B03A2E; --redbg:#F8E3E0; --amber:#8A5A00; --amberbg:#FBEFD6; --ok:#2E7D4F; --okbg:#E2F2E8;
  --nav:#FFFFFFEE;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14141F; --card:#1F1F2E; --ink:#EDE8DC; --mute:#A3A0AA; --line:#2E2E40;
    --gold:#D4B45C; --goldbg:#3A3220; --chip:#2A2A3B; --chipon:#D4B45C; --chiponink:#14141F;
    --red:#F08A7E; --redbg:#3D2225; --amber:#E8B65A; --amberbg:#3A2E18; --ok:#7CCB9A; --okbg:#1E3326;
    --nav:#1A1A28EE;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
header h1{margin:0;font-size:26px;letter-spacing:-.3px}
header .ver{font-size:12px;color:var(--mute)}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:22px 0 8px;font-weight:600}
h3{font-size:15px;margin:16px 0 6px;color:var(--gold)}
.lbl{font-size:13px;color:var(--mute);margin:10px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:20px;padding:10px 14px;min-height:40px;font:inherit;font-size:15px;background:var(--chip);color:var(--ink)}
.chip.on{background:var(--chipon);color:var(--chiponink);font-weight:600}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;margin:8px 0;font:inherit;min-height:56px}
.card .t{font-weight:600;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .s{font-size:14px;color:var(--mute);margin-top:2px}
.badge{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:6px;padding:2px 6px;border:1px solid var(--line);color:var(--mute)}
.badge.sig{background:var(--goldbg);color:var(--gold);border-color:transparent}
.badge.rev{color:var(--ink)}
.badge.test{background:var(--amberbg);color:var(--amber);border-color:transparent}
.badge.iba{color:var(--mute)}
.mention{font-size:13px;color:var(--amber)}
.miss{font-size:13px;color:var(--red)}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.grp{margin-top:6px}
.bottle{font-weight:600;margin:14px 0 2px}
.mini{display:inline-block;margin:4px 6px 0 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;min-height:40px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0}
summary{list-style:none;padding:12px 14px;min-height:48px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .p{font-weight:600}
summary .n{font-size:13px;color:var(--mute);white-space:nowrap}
details .in{padding:0 14px 12px;font-size:14px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:8px 0 6px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:22px;line-height:24px}
nav button.on{color:var(--ink);font-weight:700}
/* fiche */
#fiche{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:none;padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom))}
#fiche.on{display:block}
.back{border:0;background:none;color:var(--gold);font:inherit;font-size:17px;padding:14px 0;min-height:48px}
#fiche h1{font-size:28px;margin:4px 0 6px;line-height:1.15}
.sub{color:var(--mute);font-size:15px;margin-bottom:8px}
.banner{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.banner.r{background:var(--redbg);color:var(--red)}
.banner.a{background:var(--amberbg);color:var(--amber)}
table{width:100%;border-collapse:collapse;margin:6px 0;table-layout:fixed}
td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:16px}
td.q{font-weight:600;width:30%;padding-right:12px}
td .b{display:block;font-size:13px;color:var(--mute)}
td .b.m{color:var(--red)}
ol{padding-left:22px;margin:6px 0}
ol li{margin:6px 0}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--mute);min-width:120px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:17px;font-weight:700;margin:18px 0 8px;background:var(--chipon);color:var(--chiponink);min-height:56px}
.big.out{background:var(--chip);color:var(--ink)}
.link{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--gold);font:inherit;padding:12px 14px;margin:10px 0;min-height:48px}
.src{font-size:12px;color:var(--mute);margin-top:18px;word-break:break-all}
#fiche.grand td,#fiche.grand ol li,#fiche.grand p{font-size:20px}
#fiche.grand h1{font-size:34px}
.chk{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:12px 2px;min-height:48px}
.chk .bx{flex:none;width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;margin-top:1px}
.chk.done{color:var(--mute);text-decoration:line-through}
.chk.done .bx{background:var(--ok);border-color:var(--ok)}
.foot{font-size:12px;color:var(--mute);margin:26px 0 8px}
</style>
</head>

<header><h1 id="ttl">Recettes</h1><span class="ver" id="ver"></span></header>
<main>
  <section class="view on" id="v-rec"></section>
  <section class="view" id="v-faire"></section>
  <section class="view" id="v-stock"></section>

</main>

  <button data-v="faire"><span class="i">🍸</span>Que faire ?</button>
  <button data-v="stock"><span class="i">🍾</span>Stock</button>
  <button data-v="soiree"><span class="i">✨</span>Soirée</button>
</nav>

e de canne","k":"B","note":""}],"manque":["Rhum jamaïcain","Rhum de mélasse de Martinique"],"subs":["Cointreau à la place du curaçao orange"],"statut":"plus","mien":"m2"}]};
const STYLES = ["Frais & pétillants", "Sours & veloutés", "Exotiques", "Vifs & intenses"];
const BASES = ["Gin", "Rhum & cachaça", "Whisky", "Cognac & eaux-de-vie", "Tequila & mezcal", "Vodka", "Amers & apéritifs", "Vins & bulles"];
const KEY = "maisonvf.v1";

/* ---------- stockage : try/catch partout, repli en mémoire ---------- */
let mem = { soiree: [], coche: [] };
function load() {
  try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.soiree) && Array.isArray(o.coche)) mem = o; } } catch (e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }

/* ---------- outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const byId = {}; D.mine.forEach(m => byId[m.id] = m);
const bySlug = {}; D.cls.forEach(c => bySlug[c.slug] = c);
const famBadge = f => f === "Signature" ? '<span class="badge sig">Signature</span>' : f === "Revisité" ? '<span class="badge rev">Revisité</span>' : '<span class="badge test">À tester</span>';
const clsBadge = c => '<span class="badge iba">Classique</span>' + (c.statut === "sub" ? ' <span class="badge iba">≈</span>' : "");
const realisable = x => x.fam ? x.ok : (x.statut === "ok" || x.statut === "sub");
const key = x => x.id || x.slug;
const find = k => byId[k] || bySlug[k];

function cardMine(m) {
  const sub = [m.base, m.poivre !== "—" ? "poivre " + m.poivre.replace(/ \(.*\)$/, "") : ""].filter(Boolean).join(" · ");
  return `<button class="card" data-open="${m.id}"><div class="t">${esc(m.nom)} ${famBadge(m.fam)}</div><div class="s">${esc(sub)}</div>${m.mention.map(t => `<div class="mention">${esc(t)}</div>`).join("")}</button>`;
}
function cardCls(c) {
  let extra = "";
  if (c.statut === "sub") extra = `<div class="mention">≈ ${esc(c.subs.join(" ; "))}</div>`;
  if (c.statut === "un") extra = `<div class="miss">Il manque : ${esc(c.manque[0])}</div>`;
  return `<button class="card" data-open="${c.slug}"><div class="t">${esc(c.nom)} ${clsBadge(c)}</div><div class="s">${esc(c.base)}</div>${extra}</button>`;
}
function chips(name, values, current) {
  return `<div class="chips" data-chips="${name}">` + ["Tous"].concat(values).map(v =>
    `<button class="chip${v === current ? " on" : ""}" data-chip="${name}" data-val="${esc(v)}">${esc(v)}</button>`).join("") + "</div>";
}
function byStyle(list, render, showHeads) {
  return STYLES.map(s => {
    const l = list.filter(x => x.style === s);
    if (!l.length) return "";
    return (showHeads ? `<h3>${esc(s)}</h3>` : "") + l.map(render).join("");
  }).join("");
}

/* ---------- état des filtres (en mémoire) ---------- */
const F = { recBase: "Tous", faireStyle: "Tous", faireBase: "Tous" };

/* ---------- onglet Recettes ---------- */
function renderRec() {
  const bases = BASES.filter(b => D.mine.some(m => m.base === b));
  const l = D.mine.filter(m => F.recBase === "Tous" || m.base === F.recBase);
  const main = l.filter(m => m.fam !== "À tester"), test = l.filter(m => m.fam === "À tester");
  let h = chips("recBase", bases, F.recBase);
  h += main.length ? byStyle(main, cardMine, true) : `<p class="empty">Aucune recette avec cet alcool.</p>`;
  if (test.length) h += `<h3>À tester</h3>` + test.map(cardMine).join("");
  h += `<p class="foot">Données du fichier Excel — ${esc(D.maj)}</p>`;
  $("#v-rec").innerHTML = h;
}

/* ---------- onglet Que faire ? ---------- */
function renderFaire() {
  const okF = x => (F.faireStyle === "Tous" || x.style === F.faireStyle) && (F.faireBase === "Tous" || x.base === F.faireBase);
  const heads = F.faireStyle === "Tous";
  const mine = D.mine.filter(m => m.ok && okF(m));
  const cls = D.cls.filter(c => !c.mien && (c.statut === "ok" || c.statut === "sub") && okF(c));
  const un = D.cls.filter(c => !c.mien && c.statut === "un" && okF(c));
  let h = `<div class="lbl">Envie de quoi ?</div>` + chips("faireStyle", STYLES, F.faireStyle);
  h += `<div class="lbl">Avec quoi ?</div>` + chips("faireBase", BASES, F.faireBase);
  h += `<h2>Ma carte · ${mine.length}</h2>` + (mine.length ? byStyle(mine, cardMine, heads) : `<p class="empty">Aucune de tes recettes ne correspond.</p>`);
  h += `<h2>Classiques IBA réalisables · ${cls.length}</h2>` + (cls.length ? byStyle(cls, cardCls, heads) : `<p class="empty">Aucun classique réalisable ne correspond.</p>`);
  const groups = {};
  un.forEach(c => (groups[c.manque[0]] = groups[c.manque[0]] || []).push(c));
  const order = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b, "fr"));
  h += `<h2>Il te manque une seule bouteille · ${un.length}</h2>`;
  h += order.length ? order.map(b => `<div class="bottle">${esc(b)}</div>` + groups[b].map(c => `<button class="mini" data-open="${c.slug}">${esc(c.nom)}</button>`).join("")).join("") : `<p class="empty">Rien dans cette sélection.</p>`;
  $("#v-faire").innerHTML = h;
}

/* ---------- onglet Stock ---------- */
function renderStock() {
  let h = "";
  D.stock.forEach(k => {
    h += `<h2>${esc(k.nom)} · ${k.items.length}</h2>`;
    k.items.forEach(it => {
      const n = it.u.length;
      h += `<details><summary><span><span class="p">${esc(it.p)}</span><br><span class="s" style="font-size:13px;color:var(--mute)">${esc(it.s)}</span></span><span class="n">${n ? n + " cocktail" + (n > 1 ? "s" : "") : ""}</span></summary>`
        + `<div class="in">${n ? "Sert dans : " + it.u.map(esc).join(", ") : "N'apparaît dans aucune recette réalisable."}</div></details>`;
    });
  });
  h += `<p class="foot">Lecture seule : le stock se modifie dans le fichier Excel. ${esc(D.maj)}.</p>`;
  $("#v-stock").innerHTML = h;
}

/* ---------- onglet Soirée ---------- */
function miseEnPlace(list) {
  const frais = new Set(), prep = new Set(), btl = new Set(), poivre = new Set(), plac = new Set(), garn = [];
  list.forEach(x => {
    if (x.fam) {
      x.ings.forEach(i => {
        if (i.b === "frais") frais.add(i.n);
        else if (i.b.startsWith("maison")) prep.add(i.n);
        else if (/^(Kampot|Sikara|Voatsi|Kerala|Sichuan|Assemblage)/.test(i.b)) poivre.add(i.b);
        else btl.add(i.b);
      });
      x.mention.forEach(m => prep.add(m));
      if (x.garn) garn.push(x.nom + " : " + x.garn);
    } else {
      x.ings.forEach(i => {
        if (i.k === "F") frais.add(i.n);
        else if (i.k === "P") plac.add(i.n);
        else if (i.k === "B" || i.k === "S") btl.add(i.b.replace(/^≈ /, ""));
      });
      if (x.garn && x.garn !== "—") garn.push(x.nom + " : " + x.garn);
    }
  });
  return [["Frais à acheter", [...frais]], ["À préparer", [...prep]], ["À sortir", [...btl].sort((a, b) => a.localeCompare(b, "fr"))],
          ["Poivres à sortir", [...poivre]], ["Placard", [...plac]], ["Garnitures", garn]].filter(s => s[1].length);
}
let resetArmed = false;
function renderSoiree() {
  const list = mem.soiree.map(find).filter(Boolean);
  let h = "";
  if (!list.length) {
    h = `<p class="empty">Aucun cocktail choisi. Ouvre une fiche (onglet Recettes ou Que faire ?) et touche « Ajouter à la soirée ».</p>`;
  } else {
    h += `<h2>Au menu · ${list.length}</h2>` + list.map(x => `<button class="card" data-open="${key(x)}" data-grand="1"><div class="t">${esc(x.nom)} ${x.fam ? famBadge(x.fam) : clsBadge(x)}</div><div class="s">${esc(x.style)}</div></button>`).join("");
    h += `<h2>Mise en place</h2>`;
    miseEnPlace(list).forEach(([t, items]) => {
      h += `<h3>${esc(t)}</h3>` + items.map(it => {
        const id = t + "|" + it, d = mem.coche.includes(id);
        return `<button class="chk${d ? " done" : ""}" data-chk="${esc(id)}"><span class="bx"></span><span>${esc(it)}</span></button>`;
      }).join("");
    });
    h += `<button class="big out" id="reset">${resetArmed ? "Confirmer : tout effacer" : "Nouvelle soirée"}</button>`;
  }
  $("#v-soiree").innerHTML = h;
}

/* ---------- fiche ---------- */
// la note de la recette remplace la bouteille quand elle la nomme déjà (évite « St-Germain ou … — St-Germain … »)
function roleOrBottle(i) {
  if (!i.r || i.r === i.b) return i.b;
  const names = i.b.split(" ou ").map(n => n.split(" ")[0]).filter(w => w.length > 3);
  return names.some(w => i.r.includes(w)) ? i.r : i.b + " — " + i.r;
}
let ficheStack = [];
function openFiche(k, grand) {
  const x = find(k); if (!x) return;
  ficheStack.push({ k, grand: !!grand });
  renderFiche();
}
function renderFiche() {
  const top = ficheStack[ficheStack.length - 1];
  const f = $("#fiche");
  if (!top) { f.classList.remove("on"); document.body.style.overflow = ""; return; }
  const x = find(top.k);
  f.classList.toggle("grand", top.grand);
  let h = `<button class="back" id="back">‹ Retour</button>`;
  h += `<h1>${esc(x.nom)}</h1>`;
  if (x.fam) {
    h += `<div class="sub">${famBadge(x.fam)} ${esc(x.sous ? x.sous + " · " : "")}${esc(x.style)} · ${esc(x.base)}</div>`;
    x.mention.forEach(m => h += `<div class="banner a">${esc(m[0].toUpperCase() + m.slice(1))}</div>`);
    h += `<table>` + x.ings.map(i => `<tr><td class="q">${esc(i.q)}</td><td>${esc(i.n)}<span class="b">${esc(roleOrBottle(i))}</span></td></tr>`).join("") + `</table>`;
    h += `<div class="kv"><span>Technique</span><span>${esc(x.tech)}</span></div>`;
    h += `<div class="kv"><span>Poivre signature</span><span>${esc(x.poivre)}</span></div>`;
    h += `<div class="kv"><span>Sirop d'érable</span><span>${esc(x.erable)}</span></div>`;
    h += `<h3>Étapes</h3><ol>` + x.etapes.map(e => `<li>${esc(e)}</li>`).join("") + `</ol>`;
    h += `<h3>Garniture</h3><p>${esc(x.garn || "—")}</p>`;
    if (x.notes.length) h += `<h3>Notes de test</h3>` + x.notes.map(n => `<p>${esc(n)}</p>`).join("");
    if (x.iba) h += `<button class="link" data-open="${x.iba}">Voir la version IBA ›</button>`;
  } else {
    h += `<div class="sub">${clsBadge(x)} ${esc(x.style)} · ${esc(x.base)} · ${esc(x.cat)}</div>`;
    if (x.statut === "un") h += `<div class="banner r">Il manque : ${esc(x.manque[0])}</div>`;
    if (x.statut === "plus") h += `<div class="banner r">Il manque : ${esc(x.manque.join(", "))}</div>`;
    if (x.subs.length) h += `<div class="banner a">Substitution : ${esc(x.subs.join(" ; "))}</div>`;
    h += `<table>` + x.ings.map(i => `<tr><td class="q">${esc(i.q)}</td><td>${esc(i.n)}<span class="b${i.k === "M" ? " m" : ""}">${esc(i.b)}${i.note ? " — " + esc(i.note) : ""}</span></td></tr>`).join("") + `</table>`;
    h += `<h3>Méthode</h3><p>${esc(x.meth)}</p><h3>Garniture</h3><p>${esc(x.garn)}</p>`;
    const rem = (x.rem || "").split(" · ").filter(r => !/dans tes recettes/.test(r));
    if (rem.length) h += `<h3>Remarque</h3>` + rem.map(r => `<p>${esc(r)}</p>`).join("");
    if (x.mien) h += `<button class="link" data-open="${x.mien}">Ta version : ${esc(byId[x.mien].nom)} ›</button>`;
    h += `<div class="src">Source : IBA, recette officielle — ${esc(x.url.replace("https://", ""))}</div>`;
  }
  if (realisable(x)) {
    const inS = mem.soiree.includes(top.k);
    h += `<button class="big${inS ? " out" : ""}" id="soireeBtn">${inS ? "Retirer de la soirée" : "Ajouter à la soirée"}</button>`;
  }
  f.innerHTML = h; f.classList.add("on"); f.scrollTop = 0; document.body.style.overflow = "hidden";
}

/* ---------- navigation ---------- */
const TITLES = { rec: "Recettes", faire: "Que faire ?", stock: "Stock", soiree: "Soirée" };
const RENDER = { rec: renderRec, faire: renderFaire, stock: renderStock, soiree: renderSoiree };
let tab = "rec";
function show(v) {
  tab = v; resetArmed = false;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("#ttl").textContent = TITLES[v]; RENDER[v](); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.v) return show(t.dataset.v);
  if (t.dataset.chip) { F[t.dataset.chip] = t.dataset.val; return RENDER[tab](); }
  if (t.dataset.open) return openFiche(t.dataset.open, t.dataset.grand || (ficheStack.length && ficheStack[ficheStack.length - 1].grand));
  if (t.id === "back") { ficheStack.pop(); renderFiche(); return RENDER[tab](); }
  if (t.id === "soireeBtn") {
    const k = ficheStack[ficheStack.length - 1].k, i = mem.soiree.indexOf(k);
    if (i >= 0) mem.soiree.splice(i, 1); else mem.soiree.push(k);
    save(); return renderFiche();
  }
  if (t.dataset.chk) {
    const id = t.dataset.chk, i = mem.coche.indexOf(id);
    if (i >= 0) mem.coche.splice(i, 1); else mem.coche.push(id);
    save(); return renderSoiree();
  }
  if (t.id === "reset") {
    if (!resetArmed) { resetArmed = true; return renderSoiree(); }
    mem = { soiree: [], coche: [] }; resetArmed = false; save(); return renderSoiree();
  }
});
load();
$("#ver").textContent = "v" + VERSION;
show("rec");
</script>
