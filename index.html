:root{
  color-scheme: dark;
  --bg:#0B0A08; --panel:#14110D; --panel2:#1B1610; --line:#3A2C1C; --rule:#A07040;
  --gold:#DCA464; --gold2:#A88858; --ink:#E6E2D6; --mute:#B4A68A; --faint:#8A7C64;
  --red:#E39484; --redbg:#2B1511; --amber:#E3B877; --amberbg:#241A0E; --ok:#C9A45C;
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --caps:"Cinzel", "Trajan Pro", "Times New Roman", serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.42 var(--serif)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  background:radial-gradient(120% 60% at 50% 0%, #1A130B 0%, var(--bg) 60%) fixed}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%, transparent);padding:32px 16px 10px;text-align:center}
header .brand{font:600 12.5px/1 var(--caps);letter-spacing:.3em;color:var(--gold2)}
header h1{margin:7px 0 0;font:600 22px/1.1 var(--caps);letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
header .ver{position:absolute;right:16px;top:34px;font:500 12px var(--serif);color:var(--faint)}
header .maj{position:absolute;left:2px;top:24px;padding:9px 4px;border:0;background:none;font:500 11.5px var(--serif);color:var(--faint);cursor:pointer;white-space:nowrap}
header .maj:active{color:var(--gold)}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px auto 0;max-width:260px;color:var(--rule);font-size:9px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}
main{padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
h2{display:flex;align-items:center;gap:10px;font:600 13px/1.2 var(--caps);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
h3{display:flex;align-items:center;gap:10px;margin:20px 0 8px;font:600 12px/1 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

.lbl{font:600 11px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin:14px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:20px;padding:9px 14px;min-height:40px;font:600 15px var(--serif);background:transparent;color:var(--mute)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#140E06}
.srch{position:relative;margin:14px 0 4px}
.srch input{width:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--line);border-radius:22px;background:#15110B;color:var(--ink);font:500 17px var(--serif);padding:10px 44px 10px 40px;min-height:44px;outline:none}
.srch input:focus{border-color:var(--gold2)}
.srch input::placeholder{color:var(--faint);font-style:italic}
.srch svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);fill:none;stroke:var(--gold2);stroke-width:1.6;pointer-events:none}
.srch .clr{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--mute);font:500 24px/1 var(--serif);display:none}
.srch.on .clr{display:block}
.card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:12px 2px;margin:0;font:inherit;min-height:64px}
.card .ic{flex:none}
.card .tx{flex:1;min-width:0}
.card .t{font:600 15.5px/1.25 var(--caps);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .s{font:600 10.5px/1.4 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-top:3px}
.card .d{font:italic 500 16px/1.3 var(--serif);color:var(--mute);margin-top:2px}
.ic{width:46px;height:46px;border:1px solid var(--rule);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(#1E160C,#0E0A05)}
.ic.photo{overflow:hidden;border-color:var(--gold)}
.ic.photo img{width:100%;height:100%;object-fit:cover}
.hero{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--rule);margin:2px 0 14px}
.desc{font:italic 500 18px/1.4 var(--serif);color:var(--mute);margin:4px 0 10px}
.ic svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.badge{font:600 9.5px/1 var(--caps);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--rule);padding:4px 6px 3px;color:var(--gold2)}
.badge.sig{background:linear-gradient(#3A2610,#1E1408);color:var(--gold);border-color:var(--gold)}
.badge.rev{color:var(--gold2)}
.badge.test{color:var(--amber);border-color:#6A4A20}
.badge.iba{color:var(--faint);border-color:var(--line)}
.mention{font:italic 500 15px var(--serif);color:var(--amber)}
.miss{font:italic 500 15px var(--serif);color:var(--red)}
.empty{font-style:italic;color:var(--mute);padding:8px 0}
.bottle{font:600 12px var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:16px 0 4px}
.mini{display:inline-block;margin:4px 6px 0 0;padding:8px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 16px var(--serif);min-height:40px}
details{border-bottom:1px solid var(--line)}
.tool{display:flex;flex-direction:column;padding:12px 2px;border-bottom:1px solid var(--line)}
.tool .p{font:600 17px var(--serif)}
.tool .s{font:italic 500 15px var(--serif);color:var(--mute)}
summary{list-style:none;padding:12px 2px;min-height:52px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .p{font:600 17px var(--serif);color:var(--ink)}
summary .s{font:italic 500 15px var(--serif);color:var(--mute)}
summary .n{font:600 10.5px var(--caps);letter-spacing:.1em;color:var(--gold2);white-space:nowrap;padding-top:4px}
details .in{padding:0 2px 12px;font:italic 500 16px var(--serif);color:var(--mute)}
details .in .lk{border:0;background:none;padding:2px 0;margin:0;font:inherit;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold2);text-underline-offset:3px;cursor:pointer}
details .in .lk:active{color:var(--gold)}
details .in .lk.hit{color:var(--gold);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#0B0A08F2;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--faint);font:600 9.5px var(--caps);letter-spacing:.12em;text-transform:uppercase;padding:9px 0 7px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
.cartes{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.cartes::-webkit-scrollbar{display:none}
.vign{flex:none;width:210px;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.vign img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--rule)}
.vign span{display:block;margin-top:6px;font:600 11px var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
#ecran{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:pan-y}

#fiche{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:none;padding:env(safe-area-inset-top) 18px calc(40px + env(safe-area-inset-bottom))}

.banner{border:1px solid;padding:10px 12px;margin:10px 0;font:italic 500 16px var(--serif)}

p{margin:6px 0}

.chk{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 18px var(--serif);padding:12px 2px;min-height:48px}
.chk .bx{flex:none;width:20px;height:20px;border:1px solid var(--gold2);margin-top:3px}
.chk.done{color:var(--faint);text-decoration:line-through}

.foot{font:italic 500 14px var(--serif);color:var(--faint);margin:28px 0 8px;text-align:center}

function glassKind(v) {
  const s = (v || "").toLowerCase(); let best = null, at = 1e9;
  GLASS_KEYS.forEach(([k, g]) => { const i = s.indexOf(k); if (i >= 0 && i < at) { at = i; best = g; } });

}
function glassIcon(v) {

/* ---------- recherche ---------- */
// sans accents ni majuscules ; début de mot ; une faute de frappe tolérée à partir de 5 lettres
const norm = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/[^a-z0-9]+/g, " ").trim();
function dist1(a, b) { // vrai si a et b diffèrent d'au plus une lettre (ajout, retrait, remplacement, inversion)
  if (a === b) return true;
  const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0; while (i < la && i < lb && a[i] === b[i]) i++;
  if (la === lb) return a.slice(i + 1) === b.slice(i + 1) || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
  return la > lb ? a.slice(i + 1) === b.slice(i) : a.slice(i) === b.slice(i + 1);
}
function matcher(q) {
  const mots = norm(q).split(" ").filter(Boolean);
  if (!mots.length) return null;
  return texte => {
    const toks = norm(texte).split(" ");
    // chaque mot tapé doit commencer un mot de la fiche (« gin » trouve gin, pas « virgin ») ; à partir de 5 lettres, une faute est tolérée
    return mots.every(m => toks.some(t => t.startsWith(m) || (m.length >= 5 && (dist1(m, t) || (t.length > m.length && dist1(m, t.slice(0, m.length)))))));
  };
}

}
function byStyle(list, render, showHeads) {
  return STYLES.map(s => {
    const l = list.filter(x => x.style === s);
    if (!l.length) return "";
    return (showHeads ? `<h3 class="band"><span>${esc(s)}</span></h3>` : "") + l.map(render).join("");
  }).join("");
}

/* ---------- état des filtres (en mémoire) ---------- */
const F = { recBase: "Tous", faireStyle: "Tous", faireBase: "Tous" };

/* ---------- onglet Recettes ---------- */
function renderRec() {
  const bases = BASES.filter(b => D.mine.some(m => m.base === b));
  const l = D.mine.filter(m => F.recBase === "Tous" || m.base === F.recBase);
  const main = l.filter(m => m.fam !== "À tester"), test = l.filter(m => m.fam === "À tester");
  let h = chips("recBase", bases, F.recBase);
  h += main.length ? byStyle(main, cardMine, true) : `<p class="empty">Aucune recette avec cet alcool.</p>`;
  if (test.length) h += `<h3 class="band"><span>À tester</span></h3>` + test.map(cardMine).join("");
  h += `<p class="foot">Données du fichier Excel — ${esc(D.maj)}</p>`;
  $("#v-rec").innerHTML = h;
}

/* ---------- onglet Que faire ? ---------- */
function renderFaire() {
  const mq = matcher(Q.faire);
  const okF = x => (F.faireStyle === "Tous" || x.style === F.faireStyle) && (F.faireBase === "Tous" || x.base === F.faireBase) && (!mq || mq(texteRecette(x)));
  const heads = F.faireStyle === "Tous";
  const mine = D.mine.filter(m => m.ok && okF(m));
  const cls = D.cls.filter(c => !c.mien && (c.statut === "ok" || c.statut === "sub") && okF(c));
  const un = D.cls.filter(c => !c.mien && c.statut === "un" && okF(c));
  let h = `<div class="lbl">Envie de quoi ?</div>` + chips("faireStyle", STYLES, F.faireStyle);
  h += `<div class="lbl">Avec quoi ?</div>` + chips("faireBase", BASES, F.faireBase);
  h += `<h2>Ma carte · ${mine.length}</h2>` + (mine.length ? byStyle(mine, cardMine, heads) : `<p class="empty">Aucune de tes recettes ne correspond.</p>`);
  h += `<h2>Classiques IBA réalisables · ${cls.length}</h2>` + (cls.length ? byStyle(cls, cardCls, heads) : `<p class="empty">Aucun classique réalisable ne correspond.</p>`);
  const groups = {};
  un.forEach(c => (groups[c.manque[0]] = groups[c.manque[0]] || []).push(c));
  const order = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b, "fr"));
  h += `<h2>Il te manque une seule bouteille · ${un.length}</h2>`;
  h += order.length ? order.map(b => `<div class="bottle">${esc(b)}</div>` + groups[b].map(c => `<button class="mini" data-open="${c.slug}">${esc(c.nom)}</button>`).join("")).join("") : `<p class="empty">Rien dans cette sélection.</p>`;
  if (mq && !mine.length && !cls.length && !un.length) h += `<p class="empty">Rien ne correspond à « ${esc(Q.faire)} ».</p>`;
  body("faire").innerHTML = h;
}

/* ---------- onglet Stock ---------- */
// nom de cocktail → fiche (ta version prime sur l'IBA quand les deux portent le même nom)
const byName = {}; D.cls.forEach(c => byName[c.nom] = c.slug); D.mine.forEach(m => byName[m.nom] = m.id);
const lienFiche = (n, mq) => byName[n] ? `<button class="lk${mq && mq(n) ? " hit" : ""}" data-open="${esc(byName[n])}">${esc(n)}</button>` : esc(n);
function renderStock() {
  // garde ouvertes les bouteilles dépliées (retour de fiche)
  const ouverts = new Set([...document.querySelectorAll("#v-stock details[open]")].map(d => d.dataset.k));
  const mq = matcher(Q.stock);
  let h = "", vus = 0;
  D.stock.forEach(k => {
    // recherche : le produit lui-même, ou un cocktail où il sert (alors on le déplie)
    const items = !mq ? k.items : k.items.filter(it => mq(it.p + " " + it.s) || (it.u || []).some(n => mq(n)));
    if (!items.length) return;
    vus += items.length;
    h += `<h2>${esc(k.nom)} · ${items.length}</h2>`;
    items.forEach(it => {
      const deplie = ouverts.has(it.p) || (mq && !mq(it.p + " " + it.s));
      if (it.o) { h += `<div class="tool"><span class="p">${esc(it.p)}</span><span class="s">${esc(it.s)}</span></div>`; return; }
      const n = it.u.length;
      h += `<details data-k="${esc(it.p)}"${deplie ? " open" : ""}><summary><span><span class="p">${esc(it.p)}</span><br><span class="s" style="font-size:13px;color:var(--mute)">${esc(it.s)}</span></span><span class="n">${n ? n + " cocktail" + (n > 1 ? "s" : "") : ""}</span></summary>`
        + `<div class="in">${n ? "Sert dans : " + it.u.map(n => lienFiche(n, mq)).join(", ") : "N'apparaît dans aucune recette réalisable."}</div></details>`;
    });
  });
  if (mq && !vus) h += `<p class="empty">Rien ne correspond à « ${esc(Q.stock)} ».</p>`;
  h += `<p class="foot">Lecture seule : le stock se modifie dans le fichier Excel. ${esc(D.maj)}.</p>`;
  body("stock").innerHTML = h;
}

/* ---------- onglet Soirée ---------- */
function miseEnPlace(list) {
  const frais = new Set(), prep = new Set(), btl = new Set(), poivre = new Set(), plac = new Set(), garn = [];
  list.forEach(x => {
    if (x.fam) {
      x.ings.forEach(i => {
        if (i.b === "frais") frais.add(i.n);
        else if (i.b.startsWith("maison")) prep.add(i.n);
        else if (/^(Kampot|Sikara|Voatsi|Kerala|Sichuan|Assemblage)/.test(i.b)) poivre.add(i.b);
        else btl.add(i.b);
      });
      x.mention.forEach(m => prep.add(m));
      if (x.garn) garn.push(x.nom + " : " + x.garn);
    } else {
      x.ings.forEach(i => {
        if (i.k === "F") frais.add(i.n);
        else if (i.k === "P") plac.add(i.n);
        else if (i.k === "B" || i.k === "S") btl.add(i.b.replace(/^≈ /, ""));
      });
      if (x.garn && x.garn !== "—") garn.push(x.nom + " : " + x.garn);
    }
  });
  return [["Frais à acheter", [...frais]], ["À préparer", [...prep]], ["À sortir", [...btl].sort((a, b) => a.localeCompare(b, "fr"))],
          ["Poivres à sortir", [...poivre]], ["Placard", [...plac]], ["Garnitures", garn]].filter(s => s[1].length);
}
let resetArmed = false;
function renderSoiree() {
  const list = mem.soiree.map(find).filter(Boolean);
  // cartes : intégrées au fichier, jamais dans la mémoire de soirée → « Nouvelle soirée » ne les touche pas
  let h = (D.cartes || []).length ? `<h2>Cartes · ${D.cartes.length}</h2><div class="cartes">` + D.cartes.map((c, i) => `<button class="vign" data-carte="${i}"><img src="${c.img}" alt=""><span>${esc(c.titre)}</span></button>`).join("") + `</div>` : "";
  if (!list.length) {
    h += `<h2>Au menu · 0</h2><p class="empty">Aucun cocktail choisi. Ouvre une fiche (onglet Recettes ou Que faire ?) et touche « Ajouter à la soirée ».</p>`;
  } else {
    h += `<h2>Au menu · ${list.length}</h2>` + list.map(x => `<button class="card" data-open="${key(x)}" data-grand="1">${glassIcon(x.verre)}<span class="tx"><div class="t">${esc(x.nom)} ${x.fam ? famBadge(x.fam) : clsBadge(x)}</div><div class="s">${esc(x.style)}</div><div class="d">${esc(x.verre)}</div></span></button>`).join("");
    h += `<h2>Mise en place</h2>`;
    miseEnPlace(list).forEach(([t, items]) => {
      h += `<h3>${esc(t)}</h3>` + items.map(it => {
        const id = t + "|" + it, d = mem.coche.includes(id);
        return `<button class="chk${d ? " done" : ""}" data-chk="${esc(id)}"><span class="bx"></span><span>${esc(it)}</span></button>`;
      }).join("");
    });
    h += `<button class="big out" id="reset">${resetArmed ? "Confirmer : tout effacer" : "Nouvelle soirée"}</button>`;
  }
  $("#v-soiree").innerHTML = h;
}

/* ---------- carte en plein écran (à tourner à l'horizontale ; glisser pour changer, toucher pour fermer) ---------- */
let carteI = -1;
function montreCarte(i) {
  const n = D.cartes.length, e = $("#ecran");
  if (i < 0) { carteI = -1; e.classList.remove("on"); e.innerHTML = ""; document.body.style.overflow = ""; return; }
  carteI = (i + n) % n;
  const c = D.cartes[carteI];
  e.innerHTML = `<img src="${c.img}" alt="${esc(c.titre)}">` + (n > 1 ? `<div class="cpt">${carteI + 1} / ${n}</div>` : "");
  e.classList.add("on"); document.body.style.overflow = "hidden";
}
(() => {
  const e = $("#ecran"); let x0 = null, y0 = null;
  e.addEventListener("touchstart", t => { x0 = t.touches[0].clientX; y0 = t.touches[0].clientY; }, { passive: true });
  e.addEventListener("touchend", t => {
    if (x0 === null) return;
    const dx = t.changedTouches[0].clientX - x0, dy = t.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) montreCarte(carteI + (dx < 0 ? 1 : -1)); else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) montreCarte(-1);
    t.preventDefault();
  });
  e.addEventListener("click", () => montreCarte(-1)); // souris / clavier
  document.addEventListener("keydown", k => { if (carteI < 0) return; if (k.key === "Escape") montreCarte(-1); if (k.key === "ArrowRight") montreCarte(carteI + 1); if (k.key === "ArrowLeft") montreCarte(carteI - 1); });
})();

/* ---------- fiche ---------- */
// la note de la recette remplace la bouteille quand elle la nomme déjà (évite « St-Germain ou … — St-Germain … »)
function roleOrBottle(i) {
  if (!i.r || i.r === i.b || i.b.includes(i.r)) return i.b;
  const names = i.b.split(" ou ").flatMap(n => n.split(" ")).filter(w => w.length > 3);
  return names.some(w => i.r.includes(w)) ? i.r : i.b + " — " + i.r;
}
let ficheStack = [];
function openFiche(k, grand) {
  const x = find(k); if (!x) return;
  ficheStack.push({ k, grand: !!grand });
  renderFiche();
}
function renderFiche() {
  const top = ficheStack[ficheStack.length - 1];
  const f = $("#fiche");
  if (!top) { f.classList.remove("on"); document.body.style.overflow = ""; return; }
  const x = find(top.k);
  f.classList.toggle("grand", top.grand);
  let h = `<button class="back" id="back">‹ Retour</button>`;
  if (x.img) h += `<img class="hero" src="${x.img}" alt="${esc(x.nom)}">`;
  h += `<h1>${esc(x.nom)}</h1>`;
  if (x.fam) {
    h += `<div class="sub">${famBadge(x.fam)} ${esc(x.sous ? x.sous + " · " : "")}${esc(x.style)} · ${esc(x.base)}</div>`;
    if (x.desc_k) h += `<div class="sub">${esc(x.desc_k)}</div>`;
    if (x.desc) h += `<p class="desc">${esc(x.desc)}</p>`;
    x.mention.forEach(m => h += `<div class="banner a">${esc(m[0].toUpperCase() + m.slice(1))}</div>`);
    h += `<div class="verre">${glassIcon(x.verre)}<div><div class="k">Verre</div><div class="v">${esc(x.verre)}</div></div></div>`;
    h += `<table>` + x.ings.map(i => `<tr><td class="q">${esc(i.q)}</td><td><span class="n">${esc(i.n)}</span><span class="b">${esc(roleOrBottle(i))}</span></td></tr>`).join("") + `</table>`;
    h += `<div class="kv"><span>Technique</span><span>${esc(x.tech)}</span></div>`;
    h += `<div class="kv"><span>Poivre signature</span><span>${esc(x.poivre)}</span></div>`;
    h += `<div class="kv"><span>Sirop d'érable</span><span>${esc(x.erable)}</span></div>`;
    h += `<h3>Étapes</h3><ol>` + x.etapes.map(e => `<li>${esc(e)}</li>`).join("") + `</ol>`;
    h += `<h3>Garniture</h3><p>${esc(x.garn || "—")}</p>`;
    if (x.notes.length) h += `<h3>Notes de test</h3>` + x.notes.map(n => `<p>${esc(n)}</p>`).join("");
    if (x.iba) h += `<button class="link" data-open="${x.iba}">Voir la version IBA ›</button>`;
  } else {
    h += `<div class="sub">${clsBadge(x)} ${esc(x.style)} · ${esc(x.base)} · ${esc(x.cat)}</div>`;
    if (x.statut === "un") h += `<div class="banner r">Il manque : ${esc(x.manque[0])}</div>`;
    if (x.statut === "plus") h += `<div class="banner r">Il manque : ${esc(x.manque.join(", "))}</div>`;
    if (x.subs.length) h += `<div class="banner a">Substitution : ${esc(x.subs.join(" ; "))}</div>`;
    h += `<div class="verre">${glassIcon(x.verre)}<div><div class="k">Verre</div><div class="v">${esc(x.verre)}</div></div></div>`;
    h += `<table>` + x.ings.map(i => `<tr><td class="q">${esc(i.q)}</td><td><span class="n">${esc(i.n)}</span><span class="b${i.k === "M" ? " m" : ""}">${esc(i.b)}${i.note ? " — " + esc(i.note) : ""}</span></td></tr>`).join("") + `</table>`;
    h += `<h3>Méthode</h3><p>${esc(x.meth)}</p><h3>Garniture</h3><p>${esc(x.garn)}</p>`;
    const rem = (x.rem || "").split(" · ").filter(r => !/dans tes recettes/.test(r));
    if (rem.length) h += `<h3>Remarque</h3>` + rem.map(r => `<p>${esc(r)}</p>`).join("");
    if (x.mien) h += `<button class="link" data-open="${x.mien}">Ta version : ${esc(byId[x.mien].nom)} ›</button>`;
    h += `<div class="src">Source : IBA, recette officielle — ${esc(x.url.replace("https://", ""))}</div>`;
  }
  if (realisable(x)) {
    const inS = mem.soiree.includes(top.k);
    h += `<button class="big${inS ? " out" : ""}" id="soireeBtn">${inS ? "Retirer de la soirée" : "Ajouter à la soirée"}</button>`;
  }
  f.innerHTML = h; f.classList.add("on"); f.scrollTop = 0; document.body.style.overflow = "hidden";
}

/* ---------- navigation ---------- */
const TITLES = { rec: "Recettes", faire: "Que faire ?", stock: "Stock", soiree: "Soirée" };
const RENDER = { rec: renderRec, faire: renderFaire, stock: renderStock, soiree: renderSoiree };
let tab = "rec";
function show(v) {
  if (v !== tab) for (const k in Q) { Q[k] = ""; const i = $("#q-" + k); if (i) { i.value = ""; i.parentNode.classList.remove("on"); } }
  tab = v; resetArmed = false;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("#ttl").textContent = TITLES[v]; RENDER[v](); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.v) return show(t.dataset.v);
  if (t.dataset.carte) return montreCarte(+t.dataset.carte);
  if (t.dataset.clr) { const v = t.dataset.clr; Q[v] = ""; $("#q-" + v).value = ""; $("#s-" + v).classList.remove("on"); $("#q-" + v).focus(); return RENDER[v](); }
  if (t.dataset.chip) { F[t.dataset.chip] = t.dataset.val; return RENDER[tab](); }
  if (t.dataset.open) return openFiche(t.dataset.open, t.dataset.grand || (ficheStack.length && ficheStack[ficheStack.length - 1].grand));
  if (t.id === "back") { ficheStack.pop(); renderFiche(); return RENDER[tab](); }
  if (t.id === "soireeBtn") {
    const k = ficheStack[ficheStack.length - 1].k, i = mem.soiree.indexOf(k);
    if (i >= 0) mem.soiree.splice(i, 1); else mem.soiree.push(k);
    save(); return renderFiche();
  }
  if (t.dataset.chk) {
    const id = t.dataset.chk, i = mem.coche.indexOf(id);
    if (i >= 0) mem.coche.splice(i, 1); else mem.coche.push(id);
    save(); return renderSoiree();
  }
  if (t.id === "reset") {
    if (!resetArmed) { resetArmed = true; return renderSoiree(); }
    mem = { soiree: [], coche: [] }; resetArmed = false; save(); return renderSoiree();
  }
});
document.addEventListener("input", e => {
  const m = e.target.id && e.target.id.match(/^q-(\w+)$/); if (!m) return;
  Q[m[1]] = e.target.value; e.target.parentNode.classList.toggle("on", !!e.target.value); RENDER[m[1]]();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id && e.target.id.startsWith("q-")) e.target.blur(); });
load();
$("#ver").textContent = "v" + VERSION;
/* Mettre à jour : recharge la page en contournant le cache (même adresse, rien d'autre) */
if (location.search) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
$("#maj").addEventListener("click", () => { $("#maj").textContent = "↻ …"; location.replace(location.pathname + "?maj=" + Date.now()); });
show("rec");
</script>
